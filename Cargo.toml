[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/studio-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/7robots/mcp-studio"
rust-version = "1.90"

[workspace.dependencies]
studio-core = { path = "crates/studio-core" }
studio-gateway = { path = "crates/studio-gateway" }
studio-pattern = { path = "crates/studio-pattern" }
studio-fleet = { path = "crates/studio-fleet" }
studio-marketplace = { path = "crates/studio-marketplace" }
studio-tui = { path = "crates/studio-tui" }
studio-fake = { path = "crates/studio-fake" }

anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
keyring = { version = "4.2.0", default-features = false, features = ["v1", "apple-native-keyring-store"] }
rand = "0.10.3"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["json", "form", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process", "fs"] }
toml = "1.1.6"
unicode-width = "0.2.2"
url = "2.5.8"

pretty_assertions = "1.4.1"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
